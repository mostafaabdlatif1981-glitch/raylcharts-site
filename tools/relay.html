<!doctype html><meta charset="utf-8"><title>relay</title><body>relay
<script>
(async()=>{const u=new URLSearchParams(location.search).get('src');
try{const r=await fetch(u,{cache:'no-store'});const b=await r.arrayBuffer();
window.opener.postMessage({relay:1,name:u.split('/').pop(),buf:b},'*',[b]);document.body.textContent='sent '+b.byteLength;}
catch(e){document.body.textContent='err '+e;}})();
</script>
